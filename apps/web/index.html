<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Aplica o tema salvo (ou o do sistema) antes da renderização. Mesma chave de @edusearch/ui.
      (function () {
        var p;
        try { p = localStorage.getItem("edusearch-theme"); } catch (e) {}
        var dark = p === "dark" || (p !== "light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#146A7A" />
    <meta name="robots" content="noindex" />
    <meta name="description" content="Aplicativo EduSearch — encontre o professor certo para você. Versão de demonstração." />
    <title>EduSearch</title>

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="EduSearch" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">O EduSearch precisa de JavaScript para funcionar.</p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Aplica o tema do sistema antes da renderização (evita "flash" de tema).
      document.documentElement.dataset.theme =
        window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    </script>
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F8FAFC" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1E2E" media="(prefers-color-scheme: dark)" />

    <title>EduSearch — Encontre o professor certo para você</title>
    <meta
      name="description"
      content="EduSearch conecta estudantes e professores com recomendações personalizadas por inteligência artificial. Projeto em desenvolvimento para o HackBrasil 2026 — Trilha 03: Acesso à Educação."
    />
    <meta name="robots" content="index, follow" />

    <meta property="og:site_name" content="EduSearch" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="EduSearch — Encontre o professor certo para você" />
    <meta
      property="og:description"
      content="Uma nova forma de conectar estudantes e professores, utilizando inteligência artificial para tornar o aprendizado mais acessível e personalizado."
    />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Logotipo do EduSearch com o slogan Encontre o professor certo para você." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="EduSearch — Encontre o professor certo para você" />
    <meta
      name="twitter:description"
      content="Marketplace educacional que conecta estudantes e professores com recomendações personalizadas."
    />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" as="image" href="/brand/logo.webp" type="image/webp" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "EduSearch",
        "description": "Marketplace educacional que conecta estudantes e professores por meio de recomendações personalizadas.",
        "inLanguage": "pt-BR"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif">
        EduSearch — Encontre o professor certo para você. Ative o JavaScript para ver esta página.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

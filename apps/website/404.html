<!doctype html>
<html lang="pt-BR" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      document.documentElement.dataset.theme =
        window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    </script>
    <meta name="color-scheme" content="light dark" />
    <title>Página não encontrada — EduSearch</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
  </head>
  <body class="bg-bg text-fg antialiased">
    <!--
      Página 404 do website. Também desliga o fallback de SPA do Cloudflare
      Pages (sem 404.html, rotas inexistentes devolveriam a landing com 200).
    -->
    <main class="mx-auto flex min-h-dvh max-w-xl flex-col items-center justify-center px-6 text-center">
      <a href="/" aria-label="EduSearch — página inicial" class="rounded-md">
        <img src="/brand/logo.webp" alt="" width="160" height="40" class="h-9 w-auto dark:hidden" />
        <img src="/brand/logo-dark.webp" alt="" width="160" height="40" class="hidden h-9 w-auto dark:block" />
      </a>
      <h1 class="mt-8 text-2xl font-semibold tracking-tight text-fg-strong">Página não encontrada</h1>
      <p class="mt-2 text-fg-muted">O endereço pode ter mudado ou não existe.</p>
      <nav aria-label="Atalhos" class="mt-8 flex flex-wrap justify-center gap-3">
        <a href="/" class="inline-flex min-h-11 items-center rounded-full bg-primary bg-gradient-to-r from-petroleo to-esmeralda px-6 font-semibold text-primary-fg">Ir para o início</a>
        <a href="/termos-de-uso" class="inline-flex min-h-11 items-center rounded-full border border-line-strong bg-surface px-5 font-medium text-fg-strong hover:text-link">Termos de Uso</a>
        <a href="/politica-de-privacidade" class="inline-flex min-h-11 items-center rounded-full border border-line-strong bg-surface px-5 font-medium text-fg-strong hover:text-link">Política de Privacidade</a>
      </nav>
    </main>
    <script type="module" src="/src/legal/main.ts"></script>
  </body>
</html>

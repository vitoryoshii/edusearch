[project]
name = "edusearch-api-worker"
version = "0.3.0"
description = "Empacotamento da API EduSearch (FastAPI) para Cloudflare Python Workers."
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "pyjwt",
    "cryptography",
    "psycopg[binary]",
    "httpx",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]

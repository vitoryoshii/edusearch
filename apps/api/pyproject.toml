[project]
name = "edusearch-api"
version = "0.3.0"
description = "API do EduSearch (FastAPI)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
# Faixas compatíveis aqui; versões EXATAS (usadas no CI e recomendadas localmente) em constraints.txt.
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "pyjwt[crypto]>=2.10,<3",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "psycopg-pool>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: precisa de um PostgreSQL de testes (TEST_DATABASE_URL); pulado quando ausente",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "BLE"]

[tool.ruff.lint.per-file-ignores]
# assert e valores fictícios são esperados nos testes.
"tests/**" = ["S101", "S105", "S106"]
# SQL literal nos testes de banco: consultas legíveis numa linha valem mais que o limite de 100.
"tests/db/**" = ["S101", "S105", "S106", "S608", "E501"]

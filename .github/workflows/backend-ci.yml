# CI do backend (apps/api) e do banco (supabase/).
#
# - api: lint (ruff), formatação e testes da FastAPI SEM banco (JWT com chaves efêmeras geradas no
#   teste, JWKS local, serviço falso, banco inalcançável → 503).
# - worker: empacota a API para Cloudflare Python Workers (Pyodide) e roda o e2e completo no
#   workerd local (pywrangler dev), com Hyperdrive em modo local apontando para o Postgres do
#   Supabase CLI. Sem conta Cloudflare, sem segredos.
# - database: sobe SOMENTE o PostgreSQL local do Supabase CLI (imagem oficial, Docker do runner),
#   que cria o schema do zero aplicando supabase/migrations; roda o lint do Supabase, os testes de
#   RLS/integridade/hook e da API contra esse banco, e os lints do Security Advisor (splinter).
#
# Nada aqui usa segredos ou toca o projeto remoto: sem SUPABASE_ACCESS_TOKEN, sem `supabase link`,
# sem `db push`. As credenciais postgres/postgres são as padrão do banco LOCAL e descartável.
name: Backend CI

on:
  pull_request:
    paths:
      - "apps/api/**"
      - "supabase/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "supabase/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -eo pipefail {0}

env:
  PYTHON_VERSION: "3.13"
  SUPABASE_CLI_VERSION: "2.78.1"
  # Lints do Security Advisor: commit fixo + SHA-256 do arquivo (integridade do que é executado).
  SPLINTER_COMMIT: cc529aa9d3eeffd2e64576c7591e60b22abd205c
  SPLINTER_SHA256: e652eb2be316eaf44ad523e8b0e6e76bb4952942be86692811064d0b72402b46

jobs:
  api:
    name: API — lint e testes (sem banco)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/constraints.txt
      - name: Instalar dependências (versões fixas)
        run: pip install -c constraints.txt -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Ruff (formatação)
        run: ruff format --check .
      - name: Testes (testes de banco são pulados aqui)
        run: pytest -q -rs

  database:
    name: Banco — migrations, RLS e Security Advisor
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            apps/api/pyproject.toml
            apps/api/constraints.txt
      - name: Instalar dependências da API
        working-directory: apps/api
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Criar banco limpo e aplicar as migrations
        run: supabase db start

      - name: Migrations aplicadas
        run: |
          supabase migration list --local | tee migrations.txt
          for f in supabase/migrations/*.sql; do
            version=$(basename "$f" | cut -d_ -f1)
            grep -q "$version" migrations.txt || { echo "::error::migration $version não aplicada"; exit 1; }
          done

      - name: Lint do Supabase (plpgsql_check)
        run: supabase db lint --local --schema public,private --level warning --fail-on error

      - name: Testes de RLS, integridade, hook e API com banco
        working-directory: apps/api
        run: pytest -q -rs tests/db

      - name: Security Advisor (splinter)
        working-directory: apps/api
        run: |
          curl -fsSL "https://raw.githubusercontent.com/supabase/splinter/${SPLINTER_COMMIT}/splinter.sql" \
            -o "$RUNNER_TEMP/splinter.sql"
          echo "${SPLINTER_SHA256}  $RUNNER_TEMP/splinter.sql" | sha256sum -c -
          python scripts/security_advisor.py "$TEST_DATABASE_URL" "$RUNNER_TEMP/splinter.sql" \
            | tee "$RUNNER_TEMP/advisor.txt"
          {
            echo "### Security Advisor (banco local recém-migrado)"
            echo '```'
            cat "$RUNNER_TEMP/advisor.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Recriar do zero (reset) e testar de novo
        run: |
          supabase db reset --local
          cd apps/api && pytest -q tests/db

      - name: Parar o banco
        if: always()
        run: supabase stop --no-backup

  worker:
    name: Worker — Pyodide/workerd + e2e (JWT, RLS, isolamento)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      # Senha SOMENTE do banco local e descartável do CI.
      CLOUDFLARE_HYPERDRIVE_LOCAL_CONNECTION_STRING_HYPERDRIVE: postgresql://edusearch_api:ci-local-only@127.0.0.1:54322/postgres
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.4"

      - name: Banco limpo com as migrations
        run: |
          supabase db start
          psql "$ADMIN_DATABASE_URL" -v ON_ERROR_STOP=1 -c "alter role edusearch_api with login password 'ci-local-only'"

      - name: Dependências do e2e (cliente)
        working-directory: apps/api
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Empacotar o Worker (pacotes Pyodide) e iniciar o workerd local
        working-directory: apps/api/worker
        run: |
          uv sync --frozen
          uv run python sync_app.py
          # setsid: o Worker (uv → pywrangler → wrangler/node → workerd) ganha sessão e grupo de
          # processos PRÓPRIOS (PID == PGID). O passo de limpeza encerra só esse grupo.
          setsid uv run pywrangler dev --port 8787 --ip 127.0.0.1             --var API_SUPABASE_URL:http://127.0.0.1:54400             > "$RUNNER_TEMP/worker.log" 2>&1 < /dev/null &
          echo "$!" > "$RUNNER_TEMP/worker.pgid"
          echo "Worker iniciado: PGID $(cat "$RUNNER_TEMP/worker.pgid")"
          for i in $(seq 1 120); do curl -sf -m 5 http://127.0.0.1:8787/health > /dev/null && break; sleep 3; done
          curl -sf -m 120 http://127.0.0.1:8787/health || { tail -n 80 "$RUNNER_TEMP/worker.log"; exit 1; }

      - name: E2E no runtime do Worker (contratos, 401/403/404/422, isolamento A/B, concorrência)
        working-directory: apps/api
        env:
          E2E_ADMIN_DATABASE_URL: ${{ env.ADMIN_DATABASE_URL }}
          PYTHONIOENCODING: utf-8
        run: python worker/e2e.py local http://127.0.0.1:8787 | tee "$RUNNER_TEMP/e2e.txt"

      # Antes dos post-jobs (setup-uv faz "uv cache prune --ci", que espera o lock do cache):
      # nenhum processo do Worker pode sobreviver ao job.
      - name: Encerrar o Worker (grupo de processos deste job)
        if: always()
        run: |
          f="$RUNNER_TEMP/worker.pgid"
          if [ ! -s "$f" ]; then echo "Worker não foi iniciado."; exit 0; fi
          pgid="$(cat "$f")"
          if kill -0 -- "-$pgid" 2>/dev/null; then
            echo "Encerrando o grupo $pgid:"; pgrep -a -g "$pgid" || true
            kill -TERM -- "-$pgid" 2>/dev/null || true
            for i in $(seq 1 20); do kill -0 -- "-$pgid" 2>/dev/null || break; sleep 1; done
            if kill -0 -- "-$pgid" 2>/dev/null; then
              echo "Grupo $pgid não terminou com TERM em 20 s; enviando KILL."
              kill -KILL -- "-$pgid" 2>/dev/null || true
              sleep 2
            fi
          fi
          if pgrep -g "$pgid" > /dev/null; then
            echo "::error::Processos do Worker ainda ativos no grupo $pgid"; pgrep -a -g "$pgid"; exit 1
          fi
          # Verificação: nada de uv/pywrangler/workerd segurando o cache do uv.
          if pgrep -a -f "pywrangler|workerd|uv run" | grep -v pgrep; then
            echo "::error::Processos uv/pywrangler/workerd remanescentes"; exit 1
          fi
          echo "Worker encerrado; nenhum processo uv/pywrangler/workerd remanescente."

      - name: Resumo
        if: always()
        run: |
          {
            echo "### Worker (workerd local)"
            echo '```'
            [ -f "$RUNNER_TEMP/e2e.txt" ] && tail -n 20 "$RUNNER_TEMP/e2e.txt" || tail -n 40 "$RUNNER_TEMP/worker.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Parar o banco
        if: always()
        run: supabase stop --no-backup

# CI do frontend (website, app e design system).
#
# - checks: roda em todo Pull Request que toca o frontend. Leve (~3–5 min):
#   instalação com lockfile, typecheck, lint (efeitos React), testes unitários,
#   build e testes rápidos no servidor de desenvolvimento (StrictMode): smoke e a11y.
# - journey: jornada completa (Chrome headless do runner) + capturas de tela em
#   375/390/768/1440 px, claro e escuro (artefatos). Roda em PRs em rascunho
#   (Draft), em PRs com o rótulo "journey" ou sob demanda (Run workflow), para
#   não consumir recursos em todo commit de PR pronto para revisão.
#
# Não usa segredos, não faz deploy e não toca a API (apps/api).
name: Frontend CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    paths:
      - "apps/web/**"
      - "apps/website/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:
    inputs:
      journey:
        description: "Executar também o teste de jornada completo"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, build e testes leves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Evita rodar de novo quando o único evento é a adição de outro rótulo.
    if: github.event.action != 'labeled' || github.event.label.name == 'journey'
    steps:
      - uses: actions/checkout@v4

      - name: pnpm (versão do packageManager)
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Mesma linha do Cloudflare Pages (NODE_VERSION=22). react-router 8 exige >= 22.22.
          node-version: ">=22.22.0 <23"
          cache: pnpm

      - name: Versão do Node (mínimo 22.22)
        run: node -v

      - name: Instalar dependências (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint (efeitos React não podem retornar valor)
        run: pnpm --filter @edusearch/web lint

      - name: Testes unitários (comissão 15%, calendário, Meet)
        run: pnpm --filter @edusearch/web test:unit

      - name: Build (website, app e design system)
        run: pnpm -r build

      - name: Servidor de desenvolvimento (StrictMode) na porta 5190
        run: |
          pnpm --filter @edusearch/web exec vite --port 5190 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5190 > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/vite.log"; exit 1

      - name: Smoke test (29 rotas, console, overflow)
        run: pnpm --filter @edusearch/web smoke

      - name: Acessibilidade (axe + teclado em diálogos, menus e abas)
        run: pnpm --filter @edusearch/web a11y

  journey:
    name: Jornada completa e capturas de tela
    needs: checks
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.journey) ||
      (github.event_name == 'pull_request' &&
        (github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'journey')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Mesma linha do Cloudflare Pages (NODE_VERSION=22). react-router 8 exige >= 22.22.
          node-version: ">=22.22.0 <23"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Servidor de desenvolvimento na porta 5190
        run: |
          pnpm --filter @edusearch/web exec vite --port 5190 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5190 > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/vite.log"; exit 1

      - name: Teste de jornada (1440, 768 e 375px, claro e escuro)
        run: node apps/web/scripts/journey.mjs http://localhost:5190 "$RUNNER_TEMP/journey-shots"

      - name: Capturas de tela (375, 390, 768 e 1440 px; claro e escuro)
        if: success() || failure()
        run: node apps/web/scripts/screens.mjs http://localhost:5190 "$RUNNER_TEMP/screens" 375,390,768,1440 "" claro,escuro

      - name: Artefato — capturas de tela da Fase 2.3
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-fase-2.3
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 14

      - name: Capturas da jornada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-screenshots
          path: ${{ runner.temp }}/journey-shots
          if-no-files-found: ignore
          retention-days: 7

# CI do frontend (website, app e design system).
#
# - checks: roda em todo Pull Request que toca o frontend. Leve (~3–5 min):
#   instalação com lockfile, typecheck, lint (efeitos React), testes unitários,
#   build e testes rápidos no servidor de desenvolvimento (StrictMode): smoke, a11y
#   e login Google (GIS e Supabase FALSOS, interceptados no navegador; sem credenciais reais).
# - journey: jornada completa (Chrome headless do runner) + capturas de tela em
#   375/390/768/1440 px, claro e escuro (artefatos). Roda em PRs em rascunho
#   (Draft), em PRs com o rótulo "journey" ou sob demanda (Run workflow), para
#   não consumir recursos em todo commit de PR pronto para revisão.
#
# Não usa segredos, não faz deploy e não toca a API (apps/api).
name: Frontend CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, ready_for_review]
    paths:
      - "apps/web/**"
      - "apps/website/**"
      - "packages/ui/**"
      - "docs/legal/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:
    inputs:
      journey:
        description: "Executar também o teste de jornada completo"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, build e testes leves
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Evita rodar de novo quando o único evento é a adição de outro rótulo.
    if: github.event.action != 'labeled' || github.event.label.name == 'journey'
    steps:
      - uses: actions/checkout@v4

      - name: pnpm (versão do packageManager)
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          # Mesma linha do Cloudflare Pages (NODE_VERSION=22). react-router 8 exige >= 22.22.
          node-version: ">=22.22.0 <23"
          cache: pnpm

      - name: Versão do Node (mínimo 22.22)
        run: node -v

      - name: Instalar dependências (lockfile congelado)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint (efeitos React não podem retornar valor)
        run: pnpm --filter @edusearch/web lint

      - name: Testes unitários (comissão 15%, calendário, Meet, OAuth, estágios, e-mail)
        run: pnpm --filter @edusearch/web test:unit

      - name: Testes dos documentos jurídicos (renderização, publicação, conteúdo)
        run: pnpm --filter @edusearch/website test:legal

      - name: Build (website, app e design system)
        run: pnpm -r build

      - name: Sem segredos nos bundles (Client Secret do Google, secret key do Supabase)
        run: |
          if grep -rEl "GOCSPX-[A-Za-z0-9_-]{10,}|sb_secret_[A-Za-z0-9_-]{10,}" apps/web/dist apps/website/dist; then
            echo "Segredo encontrado no bundle"; exit 1
          fi

      - name: Páginas jurídicas no build do website (Cloudflare Pages, SEO, âncoras, links)
        run: pnpm --filter @edusearch/website check:legal

      - name: Servidor de desenvolvimento (StrictMode) na porta 5190
        run: |
          pnpm --filter @edusearch/web exec vite --port 5190 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5190 > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/vite.log"; exit 1

      - name: Smoke test (36 rotas, console, overflow)
        run: pnpm --filter @edusearch/web smoke

      - name: Acessibilidade (axe + teclado em diálogos, menus e abas)
        run: pnpm --filter @edusearch/web a11y

      # Login real em modo de testes com valores FICTÍCIOS (não são segredos). O script
      # intercepta no navegador o GIS (accounts.google.com) e o Supabase (*.supabase.co).
      - name: Servidor com login Google de testes (GIS e Supabase falsos) na porta 5191
        env:
          VITE_SUPABASE_URL: https://edusearch-ci-fake.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fake_key
          VITE_GOOGLE_CLIENT_ID: 1234567890-edusearchci.apps.googleusercontent.com
          VITE_STAGE_EMAIL_AUTH: testing
          VITE_STAGE_EMAIL_SIGNUP: testing
        run: |
          pnpm --filter @edusearch/web exec vite --port 5191 --strictPort > "$RUNNER_TEMP/vite-auth.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5191 > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/vite-auth.log"; exit 1

      - name: Entrada única, Google, e-mail e onboarding (GIS pílula, nonce, e-mail sem enumeração, sessão, avatar, logout, demo, axe, 320–1440 px)
        run: node apps/web/scripts/auth.mjs http://localhost:5190 http://localhost:5191 "$RUNNER_TEMP/auth-screens"

      - name: Website servido como estático (vite preview, sem fallback de SPA) na porta 4174
        if: success() || failure()
        run: |
          pnpm --filter @edusearch/website exec vite preview --port 4174 --strictPort > "$RUNNER_TEMP/website.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:4174 > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/website.log"; exit 1

      - name: Páginas jurídicas no navegador (URLs diretas, 404, axe, temas, 320–1440 px)
        if: success() || failure()
        run: node apps/website/scripts/legal-browser.mjs http://localhost:4174 "$RUNNER_TEMP/auth-screens/juridico"

      - name: Artefato — capturas do acesso, da conta e das páginas jurídicas
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-fase-2.5.1
          path: ${{ runner.temp }}/auth-screens
          if-no-files-found: warn
          retention-days: 14

  journey:
    name: Jornada completa e capturas de tela
    needs: checks
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.journey) ||
      (github.event_name == 'pull_request' &&
        (github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'journey')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          # Mesma linha do Cloudflare Pages (NODE_VERSION=22). react-router 8 exige >= 22.22.
          node-version: ">=22.22.0 <23"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Servidor de desenvolvimento na porta 5190
        run: |
          pnpm --filter @edusearch/web exec vite --port 5190 --strictPort > "$RUNNER_TEMP/vite.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5190 > /dev/null && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/vite.log"; exit 1

      - name: Teste de jornada (1440, 768 e 375px, claro e escuro)
        run: node apps/web/scripts/journey.mjs http://localhost:5190 "$RUNNER_TEMP/journey-shots"

      - name: Capturas de tela (375, 390, 768 e 1440 px; claro e escuro)
        if: success() || failure()
        run: node apps/web/scripts/screens.mjs http://localhost:5190 "$RUNNER_TEMP/screens" 320,375,390,768,1440 "" claro,escuro

      - name: Artefato — capturas de tela da demonstração
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-demonstracao
          path: ${{ runner.temp }}/screens
          if-no-files-found: warn
          retention-days: 14

      - name: Capturas da jornada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journey-screenshots
          path: ${{ runner.temp }}/journey-shots
          if-no-files-found: ignore
          retention-days: 7
